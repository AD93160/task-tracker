name: Build Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build --config vite.config.desktop.js --outDir apps/desktop/www
      - run: npm install
        working-directory: apps/desktop
      - run: npx electron-builder --config electron-builder.yml
        working-directory: apps/desktop

  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build --config vite.config.desktop.js --outDir apps/desktop/www
      - run: npm install
        working-directory: apps/desktop
      - run: npx electron-builder --config electron-builder.yml
        working-directory: apps/desktop

  build-linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build --config vite.config.desktop.js --outDir apps/desktop/www
      - run: npm install
        working-directory: apps/desktop
      - run: npx electron-builder --config electron-builder.yml
        working-directory: apps/desktop
