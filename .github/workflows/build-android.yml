name: Build Android

# Produit un Android App Bundle (.aab) signé, prêt à téléverser sur le
# Play Store. Déclenché manuellement : la cadence des publications Play est
# indépendante de celle des releases GitHub, qui pilotent le desktop.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Nom de version affiché (ex: 1.0.0)"
        required: true
        type: string
      versionCode:
        description: "Code de version — entier, STRICTEMENT croissant à chaque dépôt sur Play"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Le SDK Android est préinstallé sur les runners ubuntu ; seul le JDK
      # doit être fixé, AGP 8.7 exigeant Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (Vite — variante Android, sans AdSense)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npx vite build --config vite.config.android.js --outDir apps/mobile/www

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set version
        working-directory: apps/mobile/android
        run: |
          sed -i "s/versionCode .*/versionCode ${{ inputs.versionCode }}/" app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ inputs.versionName }}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      # Le keystore est stocké en secret sous forme base64. Il ne doit JAMAIS
      # être commité : le perdre rend toute mise à jour de l'app impossible,
      # Google exigeant que chaque dépôt soit signé par la même clé.
      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent — impossible de signer le bundle."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/flynt.keystore"

      - name: Build signed AAB
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/flynt.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify the bundle is signed
        run: |
          AAB=$(find apps/mobile/android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          [ -n "$AAB" ] || { echo "::error::Aucun .aab produit."; exit 1; }
          # Un bundle signé contient un bloc de signature dans META-INF.
          unzip -l "$AAB" | grep -qE "META-INF/.*\.(RSA|EC|DSA)" \
            || { echo "::error::Bundle non signé — Play le refuserait."; exit 1; }
          echo "✓ $AAB — signé"

      - uses: actions/upload-artifact@v4
        with:
          name: flynt-${{ inputs.versionName }}-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/flynt.keystore"
